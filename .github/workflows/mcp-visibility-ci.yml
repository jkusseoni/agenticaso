name: MCP and AI Visibility CI

on:
  pull_request:
    paths:
      - "app/mcp/**"
      - "app/api/mcp/**"
      - "app/api/visibility/**"
      - "app/dashboard/**"
      - "lib/mcp/**"
      - "lib/ai/**"
      - "lib/scan/**"
      - "lib/dashboard/**"
      - "lib/monitoring/**"
      - "lib/api/**"
      - "lib/db/**"
      - "proxy.js"
      - "package.json"
      - "package-lock.json"
      - "prisma/**"
      - ".github/workflows/mcp-visibility-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: "true"
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      DIRECT_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Run full test suite
        run: npm test

      - name: Run MCP security tests
        run: node --test lib/mcp/__tests__/*.test.js

      - name: Build application
        run: npm run build
